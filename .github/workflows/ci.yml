name: Análisis Técnico y Build Frontend

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-analyze:
    name: Linter, Type-Check y Build
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Instalar dependencias
        run: npm ci

      - name: 4. Análisis estático (ESLint)
        run: npm run lint
        continue-on-error: true

      - name: 5. Verificación de tipos (Vue TypeScript)
        run: npx vue-tsc --noEmit

      - name: 6. Compilar proyecto (Vite Build)
        run: npm run build
